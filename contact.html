<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stryo Fold - Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/font.css" />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #1a1a1a;
        color: #f5f5f7;
      }

      .font-oxanium {
        font-family: "Oxanium", sans-serif;
      }
      .font-raleway {
        font-family: "Raleway", sans-serif;
      }
      .font-inter {
        font-family: "Inter", sans-serif;
      }
      .font-rubik {
        font-family: "Rubik", sans-serif;
      }

      .subtext-color {
        color: #8e8e93;
      }
    </style>
  </head>
  <body class="bg-[#000000]">
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <main class="container mx-auto px-6 py-24 md:py-32">
      <div class="max-w-4xl mx-auto text-center">
        <h1 class="font-oxanium text-5xl md:text-6xl font-bold mb-16">
          CONTACT US
        </h1>

        <!-- WhatsApp Section -->
        <div class="bg-zinc-900 rounded-lg p-8 max-w-2xl mx-auto mb-12">
          <h2
            class="font-oxanium text-2xl font-bold tracking-wider uppercase mb-2"
          >
            HAVE A QUICK QUESTION?
          </h2>
          <p class="subtext-color mb-6 font-inter">
            Chat with us directly on WhatsApp for a fast response.
          </p>
          <a
            href="https://wa.me/918302100325"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center bg-green-500 text-white font-bold py-3 px-6 rounded-full hover:bg-green-600 transition-colors"
          >
            <svg class="w-6 h-6 mr-3" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.06 21.94L7.31 20.59C8.75 21.36 10.36 21.82 12.04 21.82C17.5 21.82 21.95 17.37 21.95 11.91C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2ZM12.04 20.13C10.56 20.13 9.11 19.73 7.85 19L7.54 18.82L4.44 19.65L5.29 16.63L5.09 16.31C4.36 15.02 3.96 13.57 3.96 11.91C3.96 7.46 7.59 3.83 12.04 3.83C14.23 3.83 16.22 4.66 17.72 6.16C19.22 7.66 20.05 9.65 20.05 11.91C20.05 16.36 16.49 20.13 12.04 20.13ZM17.48 14.53C17.21 14.42 15.72 13.69 15.48 13.6C15.24 13.5 15.08 13.46 14.92 13.7C14.76 13.95 14.24 14.58 14.07 14.76C13.91 14.94 13.75 14.97 13.48 14.85C13.21 14.74 12.21 14.39 11.03 13.33C10.12 12.51 9.53 11.52 9.37 11.26C9.21 11 9.32 10.89 9.43 10.78C9.53 10.68 9.66 10.5 9.79 10.34C9.91 10.18 9.95 10.05 10.03 9.9C10.11 9.75 10.06 9.61 10 9.49C9.94 9.37 9.45 8.18 9.25 7.68C9.05 7.18 8.84 7.25 8.68 7.24H8.4C8.24 7.24 7.99 7.29 7.79 7.54C7.59 7.79 7.08 8.26 7.08 9.3C7.08 10.34 7.82 11.34 7.94 11.5C8.06 11.66 9.44 13.91 11.77 14.84C12.31 15.06 12.72 15.2 13.03 15.3C13.56 15.44 13.98 15.42 14.28 15.35C14.62 15.26 15.59 14.68 15.83 14.07C16.07 13.46 16.07 12.95 16 12.83C15.92 12.71 15.76 12.65 15.52 12.53L15.48 12.51C15.71 12.42 16.48 13.69 17.21 14.42C17.48 14.53 17.48 14.53 17.48 14.53Z"
              />
            </svg>
            Chat on WhatsApp
          </a>
        </div>

        <!-- Contact Info Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-left">
          <!-- General Inquiry Card -->
          <div class="bg-zinc-900 rounded-lg p-8">
            <h2
              class="font-raleway text-xl font-bold tracking-wider uppercase mb-2"
            >
              General Inquiry
            </h2>
            <a
              href="mailto:info@stryoelectric.com"
              class="subtext-color hover:text-[#00ffff] transition-colors font-inter"
              >info@stryoelectric.com</a
            >
          </div>
          <!-- Careers Card -->
          <div class="bg-zinc-900 rounded-lg p-8">
            <h2
              class="font-raleway text-xl font-bold tracking-wider uppercase mb-2"
            >
              Careers
            </h2>
            <a
              href="mailto:careers@stryoelectric.com"
              class="subtext-color hover:text-[#00ffff] transition-colors font-inter"
              >careers@stryoelectric.com</a
            >
          </div>
          <!-- Headquarters Card -->
          <div class="bg-zinc-900 rounded-lg p-8">
            <h2
              class="font-raleway text-xl font-bold tracking-wider uppercase mb-2"
            >
              Headquarters
            </h2>
            <p class="subtext-color font-inter">
              45, Park Ville, Choradiya City,<br />
              Kamla Nehru Nagar, Ajmer Road,<br />
              Jaipur 302021
            </p>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>
    <script>
      // Fetch and inject header
      fetch("header.html")
        .then((response) => response.text())
        .then((html) => {
          document.getElementById("header-placeholder").innerHTML = html;
        });

      // Fetch and inject footer
      fetch("footer.html")
        .then((response) => response.text())
        .then((html) => {
          document.getElementById("footer-placeholder").innerHTML = html;
        });
    </script>
  </body>
</html>
